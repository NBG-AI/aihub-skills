presentation_generation_rules:
  html_output_layout:
    artboard: "1920x1080"
    aspect_ratio: "16:9"
    viewport_fit_policy: "scale_complete_slide_to_fit_viewport"
    required_behavior:
      - "HTML slides must render as a complete visible slide within the browser viewport; do not let the fixed 1920x1080 artboard exceed screen boundaries during normal viewing."
      - "Use a viewport-fitting wrapper plus explicit rendered-width/rendered-height sizing, aspect-ratio constraint, CSS transform scaling, or equivalent standards-based approach so the full 16:9 slide is visible on common desktop/laptop viewports."
      - "When scaling a fixed 1920x1080 artboard with CSS transforms, also size the wrapper to the viewport or to the exact scaled slide dimensions; never rely on the unscaled transformed element's layout box for page height."
      - "Prefer `window.visualViewport` or equivalent actual viewport measurements for standalone HTML slides so browser UI and dynamic viewport height do not cause vertical overflow."
      - "Set document/body overflow to prevent unintended horizontal or vertical scrolling caused by the slide artboard itself."
      - "Keep the internal design coordinate system compatible with the NBG 1920x1080 artboard while scaling the rendered slide down when needed."
      - "Verify fit at common desktop/laptop viewport sizes such as 1366x768, 1440x900, and 1920x1080 before finalizing HTML output."
      - "Prevent unintended internal layout collisions between cards, text blocks, decorative shapes, logos, footers, page numbers, and grouped rows/columns; only allow overlaps that are explicitly intentional brand accents and do not obscure or crowd content."
      - "Reserve clear vertical zones for title/header, primary body content, card rows/grids, bottom callouts, and footer/logo/page-number elements on the 1920x1080 artboard. Keep at least 32px spacing between adjacent content groups and at least 72px footer clearance unless a bundled template requires more."
      - "Avoid mixing normal document flow with independently positioned bottom rows unless their bounding boxes are checked for separation at the 1920x1080 artboard level."
      - "If a slide cannot fit without overlap, reduce copy, simplify components, resize cards, change the grid structure, or split the material across additional slides. Do not solve overlap by hiding overflow or placing opaque elements above other content."
    recommended_html_pattern:
      - "Wrap the fixed-size slide in a viewport-sized frame with `overflow: hidden`."
      - "Scale the 1920x1080 slide from the top-left origin to the smaller of available width/1920 and available height/1080, then center the scaled slide with translate offsets."
      - "Use actual viewport measurements (`visualViewport.width/height` when available, otherwise `innerWidth/innerHeight`) or a CSS equivalent that sets both width and height explicitly."
      - "Avoid CSS-only transform scaling that leaves the parent layout height at the unscaled 1080px size."
    layout_collision_policy:
      regression_examples:
        - "Do not repeat the `agentic-engineering-nbg-executive-presentation.html` slide 2 pattern where a board-level implication card visually overlaps the bottom three-card row."
        - "Do not repeat the `agentic-engineering-nbg-executive-presentation.html` slide 3 pattern where the top row of cards overlaps lower question cards and the dark leadership card crowds the lower `New question` card."
      required_authoring_checks:
        - "For every slide, identify the bounding regions for header/title, each card row/grid, each callout, decorative shapes that approach content, footer/logo, and page number before finalizing CSS coordinates."
        - "Confirm those regions have positive separation on the 1920x1080 artboard; card rows and bottom callouts must not intrude into each other's vertical or horizontal space."
        - "Decorative shapes may sit behind or near content only when they do not reduce readability, obscure text, or make card boundaries ambiguous."
        - "When using absolute positioning, compute or visually confirm top/bottom coordinates and heights for each row rather than relying on z-index or source order."
        - "If the safe zones cannot be preserved, revise the content model instead of squeezing elements together."
  pdf_export:
    required_when: "The user asks for a PDF, a PDF version, a print version, or to send/share the deck as PDF."
    primary_policy: "print_the_verified_html_deck_with_the_browser_engine_aesthetics_frozen"
    tool: "scripts/export-pdf.mjs (zero-dependency Node; drives headless Chrome/Chromium/Edge over the DevTools pipe; auto-detects the browser, override with --browser or NBG_BROWSER / CHROME_BIN)"
    command_template: "node <skill-root>/scripts/export-pdf.mjs <deck>.html [-o <deck>.pdf] [--size WxH] [--selector <css>] [--settle <ms>] [--debug-html <path>]"
    page_geometry:
      page_box: "the measured box of slide 1 (normally the 1920x1080 artboard = 20 x 11.25 in at 96 dpi); --size WxH overrides only when the deck's slide box is wrong"
      margins: "0"
      pages: "exactly one per top-level .slide"
      text: "vector, selectable (Page.printToPDF, printBackground=true, preferCSSPageSize=true, scale=1)"
    what_the_exporter_changes: "only the host layer: navigation toggles (.active/.hidden/inline display/[hidden]) lifted, viewport-fit wrappers (scaled #deck/.slide-wrap, fixed #stage, flex centering) neutralised, non-slide chrome hidden, animations/transitions jumped to their end state, backgrounds forced with print-color-adjust:exact"
    what_the_exporter_never_changes: "any slide's own CSS, size, fonts, colours, copy, logos or photography — slides of a different size are reported, never resized"
    preconditions:
      - "The HTML deck passed verify-deck.mjs --strict and its screenshots were inspected."
      - "Every top-level slide carries the `slide` class (nested slide-title / slide-footer helpers are fine); use --selector only for a deck not authored with this skill."
    verification:
      - "Exporter RESULT: PASS — pages == slides, page box == slide box (a mismatch means slide sizing/overflow in the HTML; fix the deck, re-export)."
      - "Rasterise and read pages: `pdftoppm -r 72 -png <deck>.pdf <prefix>` (poppler) or open the PDF; compare cover, a divider, a dense content slide and the last slide against the browser screenshots; check backgrounds, photography, logo lockup, typography, no clipping, no animation start-states."
      - "Optional: `pdfinfo <deck>.pdf` (page count, 1440 x 810 pts for the 1920x1080 artboard) and `pdftotext` to confirm the text is selectable."
    forbidden:
      - "window.print() / browser Save-as-PDF at Letter or A4, with headers, footers or margins."
      - "Print stylesheets, slide resizing, font or copy changes added only to make the deck print."
      - "Office-suite round-trips, screenshot stitching, or any raster-only PDF as the deliverable."
      - "Delivering a PDF from a deck that fails verify-deck.mjs --strict."
    no_browser_policy: "Exit code 3 = no browser on this host. Deliver the verified HTML, say the PDF could not be produced here, and give the one-line command to run on a host with Chrome/Chromium/Edge."
    delivery: "PDF plus its source HTML (unless the user wants only the PDF); report the exporter's slides / pages / page-box line and the pages read."
    in_deck_menu:
      tool: "scripts/add-deck-menu.mjs (inlines scripts/lib/print-layout.js + scripts/lib/deck-menu.js as one <script id=\"nbg-deck-menu-script\" data-nbg-deck-menu=\"<version>\"> before the last </body>; idempotent; upgrades the v1.4 nbg-pdf-menu-script block; --remove strips it)"
      when: "Always, for every delivered HTML deck, after embed-assets.mjs and before verify-deck.mjs --strict; skip only when the user explicitly declines it (then verify with --no-deck-menu)."
      behaviour:
        - "Right-click anywhere on the deck (links/form fields keep the native menu) opens an NBG-styled menu: 'Edit text' (when the click landed on text), 'Export to PDF', and — once edits exist — 'Save edited copy' and 'Discard edits', plus 'Cancel'; Escape or a click outside closes it; arrow keys move between items; deck keyboard shortcuts are suppressed while it is open."
        - "Text editing: double-click any text on a slide, or right-click → Edit text. The whole text block (accent spans inside it stay intact) becomes contenteditable with a teal outline; Enter or a click outside applies, Esc cancels, Shift+Enter inserts a line break, Ctrl/Cmd+Z undoes. Paste/drop insert plain text, and any element the browser wraps around typed text other than the toolbar's b/i/u/s tags is unwrapped on commit — the slide's CSS is never changed. Deck shortcuts are suppressed while editing."
        - "Formatting toolbar (floats above the text while editing; draggable by its grip, double-click the grip to re-dock): every control applies to the selected text when there is a selection and to the whole block otherwise. Bold / Italic / Underline / Strikethrough (a selected run gets semantic b/i/u/s tags), A− / A+ and an exact px size, font family limited to the design system's stacks (Aptos, Inter, Helvetica, Arial, Georgia, Times New Roman, Courier New, Default), text colour limited to the NBG palette (deep teal #003841, teal #007B85, bright cyan #00ADBF, electric cyan #00CFE7, black #0A1416, grey #5B6B6D, cream #F5F8F6, white, Default) — on a selection these wrap exactly the selected run in a styled span, on the block they are inline style (line-height kept proportional when the design fixed it in px); alignment is always block-level; Clear removes the selection's tags/spans or returns the block to its authored style; Done applies. Shortcuts: Ctrl/Cmd+B/I/U, Ctrl/Cmd+Shift+> and < for size. Block formatting is a 'style' edit, selection spans travel with the 'html' edit; Esc reverts both."
        - "Shape toolbar (appears with the selection frame; draggable by its grip): X / Y / W / H fields (artboard px; offsets for flow elements), fill (NBG palette, transparent, Default), border (none, 1–6 px, palette colour; a new border defaults to deep teal), corner radius, opacity, shadow (none, soft, strong, Default), Reset (original size, position and style), Done. All inline style on the element, recorded as the same 'style' edit as its geometry."
        - "Several shapes at once (text blocks, shapes and images): Shift+click adds a shape to the selection or removes it, Shift+drag on the slide draws a selection box that adds every top-level shape fully inside it, Ctrl/Cmd+A selects every top-level shape of the slide, Ctrl/Cmd+click picks one shape alone (even inside a group); the menu offers 'Add to selection' / 'Remove from selection' / 'Select all shapes on this slide'. Slide-filling background layers are never counted as shapes. The frame spans the selection (dashed marks per member): dragging inside moves all, handles scale all proportionally, arrows nudge all, the toolbar's style controls apply to all."
        - "Nested / overlapping shapes: the menu's 'Select at this point' section lists every shape stacked under the pointer, front-most first (nested parts, containers, shapes behind — text blocks inside cards included; click selects it alone, Shift+click adds it); the shape toolbar's Stack list offers the enclosing shapes, the selected one and its child shapes; Ctrl/Cmd+click on the same spot again selects the next shape out; Tab steps out to the enclosing shape, Shift+Tab back in."
        - "Arrange row (second row of the shape toolbar): Order — bring to front / forward / backward / send to back (Ctrl/Cmd+] and [, with Shift to the front/back; also in the menu) as inline z-index computed from the siblings' effective stacking order (a flow element gets position:relative; the parent gets isolation:isolate when a negative index is needed); Align left / centre / right / top / middle / bottom and Distribute horizontally / vertically (equal gaps) relative to the selection's own box (first and last stay put; distribute needs three) or 'to slide' (two or more); Group (Ctrl/Cmd+G) / Ungroup (Ctrl/Cmd+Shift+G) — logical groups whose members carry data-nbg-group=\"<id>\" (a 'group' edit record) and always select, move, resize, align and order together. The DOM is never restructured."
        - "Shape resizing / moving: right-click a card, photo panel, image, decorative block or text block → 'Resize / move shape' (the hint names the element and its size). A teal selection frame with eight handles appears (three — east, south, corner — for elements in normal flow, which only grow right/down). Drag a handle to resize (Shift keeps proportions), drag inside to move, arrows nudge 1 px (Shift 10), Alt+arrows resize, Tab selects the enclosing shape, Esc/Enter/click outside finishes. Only inline geometry changes (left/top/width/height; right/bottom set to auto so the top-left corner is pinned; position:relative for a moved flow element); pointer deltas are divided by the slide's current scale so artboard coordinates stay exact at any viewport size. 'Reset shape' restores one element; deck shortcuts are suppressed while a shape is selected."
        - "Structure / HTML panel ('Show structure' / 'Show HTML' in the menu, the </> toolbar button, Ctrl/Cmd+Shift+O / H; movable, resizable, docked right): Outline tab — the slide's shapes (cards, text blocks, images) nested by containment with a checkbox each, readable labels, sizes, group badges, All / None and a filter; tick boxes to select several, click a name to select one, Shift+click adds, Ctrl/Cmd+click toggles; the selection is highlighted on the slide and in the list; a selection never holds a container together with something inside it. Tree tab — the slide's elements synced with the visual selection both ways (selecting on the slide highlights the row; clicking a row selects that exact element, Shift+click adds, double-click edits its text, hover outlines, arrows / Enter navigate; edited elements carry a dot); Code tab — the selected element's source, editable: Apply (Ctrl/Cmd+Enter) keeps the element's type, strips scripts / event handlers / javascript: URLs, and records the change as style / group / html / attrs edits. The Code tab is a deliberate, user-requested exception to the brand guardrails; do not point ordinary recipients to it."
        - "Edits are recorded as { path, kind: 'html' | 'style' | 'group' | 'attrs', original, value } and persisted in localStorage under 'nbg-deck-edits:<pathname>#<title>'; a reload re-applies them (entries whose original no longer matches are dropped). They exist only in that browser until saved."
        - "'Save edited copy' downloads <name>-edited.html: the edits applied to a pristine snapshot of the deck taken at load (DOMParser, path lookup with a unique-markup fallback), so the copy loads exactly like the original, stays self-contained and carries the menu. 'Discard changes on this slide' restores only the slide under the pointer (its change count is in the hint); 'Discard edits' restores every slide and clears storage."
        - "'Export to PDF' commits any open edit, applies the shared print layout (all slides in flow, page box = slide box, zero margins, backgrounds forced, animations settled), calls window.print(), and restores the interactive deck (classes, inline styles, attributes, viewport-fit scaling) when the dialog closes."
        - "Ctrl/Cmd+P and the browser Print command use the same beforeprint/afterprint hooks, so any print of the deck is faithful."
        - "In the print dialog the viewer chooses Save as PDF (Chrome/Edge); paper size and margins come from the page's @page rule."
        - "window.nbgDeck = { version, pdf: { prepare, restore, exportPdf }, edit: { start, commit, cancel, isEditing, list, format, buildEditedHtml, save, discard, discardSlide, listFor, slideAt }, code: { open, show, close, isOpen, tab, refresh, target, source, setSource, apply, revert, rowOf, outlineRowOf, filter }, shape: { select, selectMany, add, remove, toggle, solo, selectAll, deselect, selected, selection, reset, align, distribute, order, group, ungroup, groupOf, shapesOf, stackAt, enclosing, inside }, resolveTextTarget, resolveShapeTarget } is exposed (window.nbgPdf aliases the pdf part); an external driver sets window.__nbgPdfExternal = true to keep the print hooks idle (export-pdf.mjs does)."
      verification: "verify-deck.mjs --strict fails when the block is missing (warning promoted) or incomplete (hard), warns on the older PDF-only block and when the block version is older than the skill's. Round-trip test: test_scripts/deck-menu-roundtrip.mjs in the development workspace (double-click edit, Enter/Esc, shortcut suppression, persistence across reload, saved copy, discard; shape select, handle drags at a scaled viewport, move, keyboard nudges, reset, persistence; multi-selection by select-all, real Shift+click / Cmd+click / Shift+drag rubber band, align, distribute, order, group/ungroup, group drags and scaling, menu add/remove, stack picker (menu items, toolbar Stack list, Tab / Shift+Tab, Cmd+click cycling), structure / HTML panel (outline with checkboxes, All / None, filter; tree sync both ways, hover outline, source apply with sanitising, attrs + html records, reload, saved copy), persistence of groups and z-index; native print → pages == slides, DOM and transforms identical after restore)."
  visual_verification:
    required_for_output_formats:
      - "html"
      - "pdf"
    screenshot_directory: "test_scripts/screenshots/ in the active working project or another user-selected output folder"
    required_viewports:
      - "1366x768"
      - "1440x900"
    optional_viewports:
      - "1920x1080"
      - "1280x720"
    required_behavior:
      - "Before marking an HTML slide deliverable complete, render browser screenshots of the generated slide at every required viewport."
      - "Save screenshots under `test_scripts/screenshots/` in the active working project, or another user-selected output folder, using descriptive filenames that include the slide name and viewport size."
      - "Open/read the generated screenshots and visually inspect the actual rendered result, not only CSS or arithmetic assumptions."
      - "If visual inspection reveals clipped content, hidden footer/recommendation blocks, excessive whitespace, overflow, unintended overlap between cards/text/shapes/logos/footers/grouped rows, unreadable text, broken logo/assets, or weak NBG design alignment, revise the slide and repeat the screenshot check."
      - "When inspecting screenshots, explicitly check card-to-card, callout-to-card, shape-to-content, logo/footer-to-content, and page-number clearance; a deck is not complete until all unintended collisions are removed and rechecked."
      - "Final response must mention the screenshot files or rendered artifacts used for visual verification and summarize whether clipping/overflow or visual mismatches were observed."
    browser_executable_requirement: >-
      Screenshot automation requires an explicit browser executable path supplied by the local user or execution environment; do not rely on a committed machine-specific default.
    html_file_url_policy: >-
      Build the file:// URL from the current checkout location and the repository-relative generated HTML path at execution time; do not commit machine-specific absolute HTML paths.
    suggested_browser_command_template: >-
      <browser-executable> --headless=new --disable-gpu --hide-scrollbars --window-size=<width>,<height> --screenshot=test_scripts/screenshots/<slide-name>-<width>x<height>.png file://<absolute-path-derived-from-active-output-location>/<relative-html-slide-path>
  before_generating:
    - "Open and inspect bundled `NBG-Design/NBG Design System.html` from the skill root."
    - "Open and inspect bundled `NBG-Design/slide-templates.jsx` from the skill root."
    - "Use bundled `NBG-Design/assets/` from the skill root for logos and existing photography."
    - "Use bundled presentation screenshots only as visual references, not as source code."
  content_structure:
    - "Start with an NBG-style cover slide."
    - "Use divider slides for major sections."
    - "Use content slides for explanations, comparisons, statistics, and takeaways."
    - "Prefer concise slide copy and speaker-notes-style expansion where needed."
  quality_checks:
    - "For HTML output, run `node <skill-root>/scripts/verify-deck.mjs <deck>.html --strict` and confirm it passes (mandatory, headless-safe). Embed assets with scripts/embed-assets.mjs first. Never report a deck complete while this gate fails."
    - "For PDF output, confirm the source HTML passed verify-deck.mjs --strict, that `node <skill-root>/scripts/export-pdf.mjs <deck>.html` reported RESULT: PASS (pages == slides, page box == slide box, normally 1920x1080), and that rasterised pages were read and match the browser render (backgrounds, photography, logo, typography, no clipping, no animation start-states). Deliver the PDF with its source HTML."
    - "For HTML output, confirm the deck carries the right-click deck menu (add-deck-menu.mjs; checked by verify-deck.mjs --strict) and tell the user how to use it (double-click text to edit; right-click for Resize / move shape, Export to PDF, Save edited copy), unless the user declined it."
    - "Confirm every slide has a clear purpose."
    - "Confirm colors match the allowed palette."
    - "Confirm language setting is consistent with the requested deck language, or English (`en`) when no language was requested."
    - "Confirm final output format is consistent with the requested format, or HTML (`html`) when no format was requested."
    - "For HTML output, confirm the complete 16:9 slide fits inside the browser viewport without unintended horizontal or vertical overflow."
    - "For HTML output, render and visually inspect screenshots at 1366x768 and 1440x900 before delivery; do not rely only on code review or fit calculations."
    - "For HTML output, verify screenshots show no clipped content, hidden bottom blocks, unintended scroll/overflow, unintended element overlap, broken assets, or unreadable text."
    - "For HTML output, confirm cards, text blocks, decorative shapes, logos, footer elements, page numbers, and grouped rows/columns remain visually separated or intentionally layered without obscuring content."
    - "If screenshots reveal overlap, revise layout zones/copy/grid structure and repeat screenshot validation at 1366x768 and 1440x900 before delivery."
    - "Confirm NBG logo visibility matches the requested `show_logo` setting."
    - "Confirm no newsletter/email-specific layouts are used unless explicitly requested."

out_of_scope_by_default:
  - "PowerPoint (.pptx) output and HTML-to-PowerPoint conversion: this skill is HTML presentations and their PDF export only"
  - "NBG-Design/newsletter/"
  - "NBG-Design/nbg-gpt/"
  - "NBG-Design/notebooklm/"
  - "NBG-Design/screenshots/email-*.png"
  - "NBG-Design/screenshots/gpt-*.png"
  - "NBG-Design/screenshots/lm-*.png"
  - "NBG-Design/screenshots/train-email-*.png"

missing_information_policy:
  rule: "ask_user_instead_of_fallback_except_explicit_defaults"
  explicit_defaults:
    language_if_not_supplied: "en"
    final_output_format_if_not_supplied: "html"
  do_not_guess:
    - "presentation topic"
    - "audience"
    - "slide count"
    - "whether to modify source design files"
