# Pi Agent skill-bundled presentation context config for the NBG Presentation Design System.
#
# Important: Pi skills are loaded on demand through SKILL.md. This YAML is bundled
# as reference context inside the user-level `nbg-design` skill. It is not Pi
# native settings, and it is not intended to require the original project root.
#
# Resolve all bundled paths relative to the skill root directory that contains
# SKILL.md, for example `NBG-Design/NBG Design System.html`.
# No secrets, API keys, or expiring credentials are stored here.

schema_version: "pi-presentation-context/v1"
config_name: "nbg-design-presentation-generation"
config_status: "ready_as_skill_bundled_context_file"

project:
  name: "nbg-design-user-skill"
  paths_relative_to: "skill_root"
  root_resolution: "Resolve bundled files relative to the directory containing this skill's SKILL.md, not the shell current working directory or original project root."
  path_policy: "skill_relative_paths_only_for_bundled_files"
  naming_note: >-
    The user referred to an "NPG Design" folder. Local project evidence found
    `NBG-Design/` and no `NPG Design/` folder. This config intentionally uses
    `NBG-Design/`, the available National Bank of Greece design-system folder.

pi_runtime:
  native_settings_format: "json"
  native_project_settings_path: "not_applicable_for_user_level_skill"
  yaml_usage: "reference_context_loaded_from_the_user_level_skill_folder"
  required_working_directory: "any"
  at_file_path_resolution: "Do not rely on relative @file inclusion from arbitrary working directories; use the loaded skill and resolve bundled paths from the skill root."
  recommended_command_template: |-
    pi /skill:nbg-design "Create a presentation about <topic> for <audience> with <slide count/depth>."
  print_mode_command_template: |-
    pi -p /skill:nbg-design "Create a presentation outline or slide specification about <topic> for <audience> with <slide count/depth>."
  required_credentials:
    storage: "environment_or_pi_login_only"
    do_not_store_in_this_file:
      - "ANTHROPIC_API_KEY"
      - "OPENAI_API_KEY"
      - "GOOGLE_API_KEY"
      - "AZURE_OPENAI_API_KEY"
      - "AZURE_AI_INFERENCE_API_KEY"

presentation_workflow:
  objective: >-
    Generate presentation content, slide structure, and implementation guidance
    that follows the local NBG presentation design system.
  expected_agent_behavior:
    - "Read this YAML config before proposing or generating slides."
    - "Inspect the referenced design-system documentation and templates before writing final slide output."
    - "Use NBG presentation assets and templates; do not invent a parallel design system."
    - "Ask for missing presentation-specific inputs instead of substituting fallback values, except for the explicit defaults defined in this file."
    - "If no deck language is specified, assume English (`en`)."
    - "If no final output format is specified, assume HTML (`html`)."
    - "Accepted output formats are html (default) and pdf; PowerPoint (.pptx) is out of scope for this skill — when asked for it, say so and deliver the HTML deck and its PDF. A PDF is always exported from the finished, verified HTML deck with `node <skill-root>/scripts/export-pdf.mjs <deck>.html` — one page per slide at the slide's own box (the 1920x1080 artboard = 20 x 11.25 in, zero margins, backgrounds forced, vector text). Never author a PDF separately, never re-lay the deck out for paper, never produce it via window.print at Letter/A4, browser Save-as-PDF with headers/footers, Office round-trips, or stitched screenshots."
    - "The HTML gate (embed-assets.mjs, verify-deck.mjs --strict, visual check) is a precondition for the PDF export: the PDF inherits every defect of the HTML. Do not export a deck that fails verify-deck.mjs --strict."
    - "export-pdf.mjs verifies that the PDF page count equals the slide count and that every slide box equals the page box, and exits non-zero otherwise. Treat any such failure as a defect in the deck's slide sizing/overflow: fix the HTML and re-export; do not add print stylesheets, resize slides, or change copy to make it print."
    - "After the export, rasterise a few pages (e.g. `pdftoppm -r 72 -png <deck>.pdf <prefix>` when poppler is present, otherwise open the PDF) and read them next to the browser screenshots: cover, one divider, one dense content slide, last slide at minimum. Deliver the PDF together with its source HTML unless the user wants only the PDF, and report the exporter's slides/pages/page-box line."
    - "If export-pdf.mjs exits with code 3 (no Chrome/Chromium/Edge on the host), deliver the verified HTML, state that the PDF could not be produced on this host, and give the one-line export command to run where a browser exists. Never substitute a differently produced PDF."
    - "Every delivered HTML deck carries the in-deck right-click menu: run `node <skill-root>/scripts/add-deck-menu.mjs <deck>.html` after embed-assets.mjs and before verify-deck.mjs --strict (which requires it unless --no-deck-menu is passed because the user declined the menu). The menu offers Edit text (in-place editing of any text on a slide, also by double-click; Enter applies, Esc cancels; a toolbar gives bold/italic/underline/strike, font size, family, NBG palette colour, alignment), Resize / move shape (selection frame with handles on any card, photo panel, image, decorative block or text block; drag to resize or move, arrows nudge; Reset shape restores it), Export to PDF (same print-layout code as export-pdf.mjs; viewer picks Save as PDF; 1920x1080 page, zero margins and backgrounds preset), Save edited copy (downloads the deck with the edits applied) and Discard edits. Edits persist in the browser until saved. Tell the user in one line: double-click text to edit it; right-click for Resize / move shape, Export to PDF and Save edited copy."
    - "The in-deck menu edits text, text formatting (fonts limited to the design system's stacks, colours to the NBG palette), geometry and shape styling (fill, border, radius, opacity, shadow from the same palette) only; images, new elements and structure remain the skill's job — regenerate the deck for those. Shape changes do not re-flow neighbours, so the skill's overlap rules still apply to what the viewer produces. The CLI exporter prints the file on disk, not unsaved in-browser edits: to deliver a PDF of an edited deck, export the saved -edited.html copy."
    - "For HTML presentation output, preserve a 16:9 NBG slide composition while fitting the complete slide inside the browser viewport."
    - "Delivered HTML must be fully self-contained: embed every image (NBG logo AND photography) as a base64 data URI by pasting the entire contents of the matching NBG-Design/assets/<asset>.datauri.txt file as the src. NEVER reference an image by a file:// URL, an absolute path, or a relative path in delivered HTML — a file:// path into the plugin cache (e.g. file:///home/<user>/.claude/plugins/.../logo-knockout.png) breaks on every other machine and is the most common cause of a missing logo. Never substitute the logo with text, initials, a colored box, or a CSS/SVG re-creation. Choose the logo variant by background (primary on light, knockout on dark, small for footers). Before delivery, confirm every img/background-image value starts with data:image/ and there are zero file://, absolute, or relative image paths."
    - "Do not hand-paste large base64 data URIs (the step that fails in headless/SSH/Linux runs). Author the deck with image placeholder tokens ({{LOGO_PRIMARY}}, {{LOGO_KNOCKOUT}}, {{LOGO_SMALL}}, {{PHOTO_FIELDS}}, {{PHOTO_HEART}}, {{PHOTO_PARTHENON}}, {{PHOTO_SKATE}}, {{PHOTO_STREET}}), define each token once via a reusable CSS background-image class, then embed deterministically with `node <skill-root>/scripts/embed-assets.mjs <deck>.html`. The script resolves bundled assets relative to itself, so it works from any cwd and on any host."
    - "Run the browser-free gate `node <skill-root>/scripts/verify-deck.mjs <deck>.html --strict` before delivery. It works without a display (headless/SSH safe) and fails on unresolved tokens, non-embedded image paths, missing assets, photo-less/too-small decks, or bare NBG/NPG text-logo substitutes. Never deliver a deck that fails it."
    - "If the skill was moved to another machine, confirm the whole skill folder travelled including NBG-Design/assets/ (the *.datauri.txt files). A missing assets directory reported by embed-assets.mjs is the root cause of missing logos/photography."
    - "Before delivering generated HTML slides, render screenshots and visually inspect them for clipping, overflow, unintended element overlap, unreadable text, and NBG design alignment."
    - "When a browser is available, capture those screenshots with `node <skill-root>/scripts/screenshot-deck.mjs <deck>.html` (auto-detects Chrome/Chromium/Edge, navigates every slide, writes PNGs at 1366x768 and 1440x900), then read and inspect each PNG. If it exits with code 3 (no browser, typical headless host), rely on verify-deck.mjs --strict instead."
    - "For HTML presentation layouts, reserve non-overlapping zones for title/header, body content, card grids/rows, bottom callouts, footer, logo, and page-number elements; revise or split slides whenever content cannot fit safely."
    - "Keep newsletter/email prototypes out of scope unless the user explicitly asks to reuse them."
  required_user_inputs_for_each_deck:
    - "presentation_topic"
    - "target_audience"
    - "desired_slide_count_or_depth"
  optional_user_inputs_with_defaults:
    - "preferred_language: one of en, gr, bi; default en"
    - "final_output_format_or_delivery_target: one of html, pdf; default html (pdf is exported from the HTML deck by scripts/export-pdf.mjs)"

