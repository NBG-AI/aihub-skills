# Briefing-style showcase: the reference deck ("SOFIA Chat & Voice - Release Outlook",
# index 1.html) rebuilt one slide per briefing template. Compare side by side with the HTML.
deck:
  title: "SOFIA Chat & Voice - Release Outlook"
  style: briefing           # briefing (default) | design-system
  language: en
  show_logo: true
  footer_label: "SOFIA Chat & Voice · Release outlook · Internal"

slides:
  - template: brief_cover
    eyebrow: "NBG · AI Unit · Internal working session"
    title: "SOFIA ~Chat~ & SOFIA ~Voice~"
    subtitle: "Updates and pending deployments, the next weeks"
    sections:
      - heading: "Section 1 · SOFIA Chat"
        text: "9 capabilities in UAT, going to production 9 September to end September, plus Kafka enforcement across all agents."
      - heading: "Section 2 · SOFIA Voice"
        text: "7 agents from 31 August onward, one shared identification flow, transcript handoff and Kafka monitoring."
    foot_left: "Status as at 30 August 2026"
    foot_right: "Internal · not for distribution"
    notes: "Cover: eyebrow, accent rule, SemiBold title with accent spans, two section cards, foot line."

  - template: brief_cards
    title: "Before both sections"
    sub: "the platform prerequisite"
    meta: ["Blocks the 9 Sep Chat release", "Applies to every agent, both channels"]
    callout:
      badge: "P0"
      tone: stop
      title: "Audit logging in agent-core-middleware"
      text: "Required for **all monetary and important transactions performed by an agent**, a platform concern, not a per-feature one. Until it lands, no agent-executed monetary flow can go to production."
    cards:
      - heading: "What is missing"
        items:
          - "Audit logging for **recent transactions**"
          - "Audit logging for **ημερολόγιο**"
          - "Enforced at the **middleware layer**, not per agent"
      - heading: "What it gates today"
        items:
          - "**Bill payments**, Chat, 9 Sep"
          - "**Monetary transactions between own accounts**, Chat, 9 Sep"
          - "**Credit card payment**, Chat, 9 Sep"
          - "Every future monetary or important agent action, Chat and Voice alike"
      - heading: "Why it comes first"
        items:
          - "Paid once at platform level: **every agent inherits it**"
          - "The only item here whose slippage moves **two production dates**"
          - "No agent-level workaround is acceptable for audit"
    note: "**Ask:** name an owner and a committed landing date, then re-confirm whether 9 September holds for bill payments, own-account transfers and credit card payment."

  - template: brief_table
    tag: "Section 1"
    title: "SOFIA Chat"
    sub: "all 9 in UAT"
    meta: ["Production 9 Sep to end Sep 2026"]
    rail:
      label: "To production"
      items:
        - { key: "9 Sep", note: "4 items", tone: stop }
        - { key: "12 Sep", note: "1 item" }
        - { key: "14 Sep", note: "3 items" }
        - { key: "end Sep", note: "1 item" }
    table:
      columns:
        - { header: "Capability", width: 0.25, kind: name }
        - { header: "Now", width: 0.08, kind: muted }
        - { header: "Production", width: 0.12, kind: date }
        - { header: "Dependency / detail", width: 0.55, kind: text }
      rows:
        - { status: stop, cells: ["Bill payments", "UAT", "9 Sep", "**Blocker:** dependency in service audit logging for the recent transactions and ημερολόγιο"] }
        - { status: stop, cells: ["Monetary transactions between own accounts", "UAT", "9 Sep", "**Blocker:** dependency in service audit logging for the recent transactions and ημερολόγιο"] }
        - { status: stop, cells: ["Credit card payment", "UAT", "9 Sep", "**Blocker:** dependency in service audit logging for the recent transactions and ημερολόγιο"] }
        - { status: ok, cells: ["Cards issuance for dual", "UAT", "9 Sep", "No dependency recorded"] }
        - { status: wait, cells: ["PFM extension in Personalized Banking Agent", "UAT", "12 Sep", "In UAT for **basic info**. Will follow the production release for **mobile banking PFM on 12/9**."] }
        - { status: ok, cells: ["Forgot Username / Password", "UAT", "14 Sep", "**TS.01.01.01.01**, Αντικατάσταση credentials (Forgot Username and Password)"] }
        - { status: ok, cells: ["Forgot Password", "UAT", "14 Sep", { text: "Three scenarios:", sub: ["TS.01.01.01.01, Επαναφορά password μέσω Email · created 24/07/26 · updated 07/08/26", "TS.01.01.01.02, Επαναφορά password μέσω Προσωπικών Στοιχείων · created 24/07/26 · updated 03/08/26", "TS.01.01.01.03, Επαναφορά password μέσω Κάρτας · created 24/07/26 · updated 03/08/26"] }] }
        - { status: ok, cells: ["Issue Credentials", "UAT", "14 Sep", "No dependency recorded"] }
        - { status: warn, cells: ["NBG Securities chat", "UAT", "end Sep", "Production **along with the voice equivalent**. **Many dependencies in Kalimera.**"] }
    band:
      - key: "Chat functionality"
        text: "**Enforce Kafka writing to all agents**, applied across every SOFIA Chat agent rather than adopted agent by agent."
      - key: "Chat asks"
        asks:
          - "**Audit logging**, owner and landing date for the agent-core-middleware work."
          - "**9 September**, confirm or move bill payments, own-account transfers and credit card payment."

  - template: brief_table
    tag: "Section 2"
    title: "SOFIA Voice"
    sub: "7 agents"
    meta: ["From 31 Aug 2026"]
    flow:
      label: "Identification\nevery case"
      steps:
        - { text: "Ask AFM", sub: "locate the customer" }
        - { text: "Ask card last 4 digits", sub: "if the flow requires it", cond: true }
        - { text: "Send OTP to registered mobile", sub: "verify before proceeding" }
    rail:
      label: "Milestones"
      items:
        - { key: "31 Aug", note: "2 items" }
        - { key: "2 Sep", note: "1 item" }
        - { key: "3 Sep", note: "1 item" }
        - { key: "No date", note: "3 items" }
    table:
      columns:
        - { header: "Agent", width: 0.23, kind: name }
        - { header: "Status", width: 0.16, kind: status }
        - { header: "Milestone", width: 0.14, kind: date }
        - { header: "Sign-off / detail", width: 0.47, kind: text }
      rows:
        - { status: warn, cells: ["IB password reset with OTP", { label: "Awaiting business OK", tone: warn }, "3 Sep", "Implementation by **3/9**. **Need OK from business.** Currently in UAT."] }
        - { status: warn, cells: ["Lost card, all card types", { label: "Awaiting sign-off", tone: warn }, "No date", "**UAT completed**, need the final say from **Manoli**."] }
        - { status: ok, cells: ["Card activation", { label: "Cleared to proceed", tone: ok }, "31 Aug", "**OK from Martini** to proceed. Final UAT for flow continuation **card activation to set pin** on **31/8**."] }
        - { status: ok, cells: ["Set pin", { label: "Activating", tone: ok }, "31 Aug", "**Activate on 31/8.**"] }
        - { status: warn, cells: ["Card tracking", { label: "Awaiting feedback", tone: warn }, "2 Sep", "Under implementation. Feedback for **tracking number availability on 2/9**."] }
        - { status: wait, cells: ["Transactions & balances (cards & accounts)", { label: "Pre-UAT", tone: wait }, "No date", "Pre-UAT, under implementation. **Need alignment with business** for functionality and verification of user."] }
        - { status: warn, cells: ["Verification with partial pin", { label: "Awaiting final OK", tone: warn }, "No date", "Before handoff to a human agent the verification agent kicks in; the user **can opt out and continue un-verified**. Initial UAT OK from **CC**, need to run more cases and final OK."] }

  - template: brief_panels
    tag: "Section 2"
    title: "SOFIA Voice"
    sub: "functionalities & asks"
    meta: ["Kafka replaces LangSmith · transcript handoff"]
    panels:
      - title: "Kafka monitoring & turn off LangSmith"
        blocks:
          - type: matrix
            header: ["Agent", "Status"]
            rows:
              - { name: "Voice router", status: { label: "OK", tone: ok } }
              - { name: "IVR router", status: { label: "Next deployment", tone: wait } }
              - { name: "Card activation", status: { label: "OK", tone: ok } }
              - { name: "Set pin", status: { label: "OK", tone: ok } }
              - { name: "Lost card", status: { label: "Next deployment", tone: wait } }
              - { name: "Verification", status: { label: "OK", tone: ok } }
              - { name: "Transactions & balances", status: { label: "On prod deployment", tone: wait } }
              - { name: "Card tracking", status: { label: "On prod deployment", tone: wait } }
          - type: note
            text: "LangSmith is switched off as each agent moves onto Kafka monitoring."
          - type: box
            title: "Dated checkpoints ahead of production"
            items:
              - "**31 Aug**, final UAT for card activation to set pin; set pin activates"
              - "**2 Sep**, feedback on tracking number availability for card tracking"
              - "**3 Sep**, IB password reset implementation complete"
      - title: "Transcript to human agent"
        blocks:
          - type: box
            title: "Retrieve the transcript from our service"
            pill: { label: "Partially unblocked", tone: warn }
            items:
              - "**Genesys**, OK"
              - "Need implementation from **Telecroft & ...** to retrieve from our service"
              - "Need to **test client credentials** to retrieve the transcript"
          - type: ask
            title: "Voice asks · to close this session"
            items:
              - "**Lost card**, final say from **Manoli** to release the completed UAT."
              - "**IB password reset**, the outstanding OK from **business**."
              - "**Verification with partial pin**, remaining cases with **CC**, then final OK."
              - "**Transactions & balances**, business alignment on functionality and verification of user."
              - "**Transcript**, name the second party behind \"Telecroft & ...\" and test the client credentials."
