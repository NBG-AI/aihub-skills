# Showcase deck: one slide per template, using the copy from slide-templates.jsx so the
# PPTX can be compared side by side with the HTML design system.
deck:
  title: "NBG Design System showcase"
  style: design-system  # briefing (default) | design-system
  language: en          # en | gr | bi
  show_logo: true
  # accent: "#003841"   # optional global accent (tweaks panel); omit to keep each template's default

slides:
  - template: cover1
    photo: street
    title: "Placeholder title\n~that may run on two lines.~"
    subtitle: "Subtitle text describing the report, audience or programme."
    meta: ["Meeting Location / Description", "DD / MM / YYYY"]
    notes: "Cover 1 - hero photo on dark. The default cover."

  - template: cover2
    photo: parthenon
    eyebrow: "Annual Report"
    title: "Building *tomorrow*, today."
    subtitle: "A subtitle providing further context about the document, the audience and the purpose of the report."
    meta: ["Athens, Greece", "14 / 03 / 2026"]

  - template: cover3
    number: "01"
    eyebrow: "Strategy Update · Q1 2026"
    title: "A clear voice\n~in changing times.~"
    meta: ["Investor Day", "Athens · 14 March 2026"]

  - template: divider_image
    number: "02"
    photo: fields
    title: "Divider"
    caption: "A short caption sets up the section's argument, who it concerns and why it matters."
    footer_label: "Section 02"

  - template: divider_dark
    number: "03"
    title: "Looking ahead."
    caption: "A paragraph of supporting copy describes what this section covers and the questions it answers."
    footer_label: "Section 03"

  - template: divider_bright
    number: "04"
    eyebrow: "Section 04"
    title: "People & Culture"
    caption: "How we invest in our teams, the communities we serve, and the next generation of Greek talent."
    footer_label: "Section 04"

  - template: content_image_right
    photo: skate
    eyebrow: "02 · People"
    title: "A title that runs on a single line, or two."
    body:
      - "Body copy sits below the title in a clear single column. It is set in the body type at 22px with comfortable line-height, prioritising readability for printed reports and large rooms alike."
      - "Use the accent rule above to signal a new content block. Keep paragraphs short. Three to five sentences works best for spoken delivery."
    footnote: "Source: Internal data, FY2025. All figures unaudited unless otherwise stated."

  - template: content_columns
    eyebrow: "01 · Strategy"
    title: "Three pillars carry the plan forward."
    columns:
      - number: "01"
        heading: "Customer first"
        body: "Re-platform digital channels with a single sign-on, faster onboarding and a refreshed mobile experience."
      - number: "02"
        heading: "Sustainable growth"
        body: "Channel capital into green lending, SME support and renewable infrastructure across the Greek market."
      - number: "03"
        heading: "People & culture"
        body: "Invest in our teams through new learning programmes, cross-functional mobility and clearer career paths."

  - template: content_stat
    eyebrow: "03 · Performance"
    title: "The year in numbers."
    stat: { value: "+12.4", unit: "%", caption: "Year-on-year growth in net interest income." }
    rows:
      - { label: "Operating income", value: "€2.61b" }
      - { label: "Cost / income ratio", value: "32.4%" }
      - { label: "CET1 ratio", value: "18.7%" }
      - { label: "Active customers", value: "5.4m" }

  - template: content_chart
    eyebrow: "03 · Performance"
    title: "Mobile adoption outpaced every peer in 2025."
    body:
      - "Active mobile users grew 23% year on year, lifting digital transactions to 78% of total volume."
    chart:
      type: column
      categories: ["Q1", "Q2", "Q3", "Q4"]
      series:
        - { name: "NBG", values: [2.1, 2.3, 2.6, 2.8] }
        - { name: "Peer average", values: [1.9, 2.0, 2.1, 2.2] }
      number_format: "0.0"

  - template: content_table
    eyebrow: "04 · Benchmark"
    title: "Key metrics versus systemic peers."
    table:
      headers: ["Metric", "NBG", "Peer A", "Peer B"]
      rows:
        - ["Total assets (€bn)", "78.5", "82.1", "75.3"]
        - ["CET1 ratio", "17.2%", "15.8%", "14.9%"]
        - ["Cost / income", "32.4%", "38.1%", "41.0%"]
        - ["Active mobile users (m)", "2.8", "2.4", "2.1"]

  - template: back_cover
